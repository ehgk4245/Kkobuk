name: Deploy Lambda (Training Pipeline)

on:
  push:
    branches: [main]
    paths:
      - 'ai/lambda/**'
      - 'ai/shared/**'
      - '.github/workflows/deploy-lambda.yml'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: kkobuk-lambda
  FUNCTION_NAME: kkobuk-training

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build
        run: |
          IMAGE_URI=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker build \
            -t $IMAGE_URI \
            -f ai/lambda/Dockerfile \
            ./ai
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Update Lambda function image
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.FUNCTION_NAME }} \
            --image-uri ${{ steps.build.outputs.image_uri }}
          aws lambda wait function-updated \
            --function-name ${{ env.FUNCTION_NAME }}

      - name: Update Lambda environment variables
        run: |
          aws lambda update-function-configuration \
            --function-name ${{ env.FUNCTION_NAME }} \
            --environment "Variables={AI_DATABASE_URL=${{ secrets.AI_DATABASE_URL }},S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }},JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }},REDIS_HOST=${{ secrets.EC2_API_PRIVATE_IP }},REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}}"
