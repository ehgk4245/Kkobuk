name: Build Client

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache mediapipe models
        uses: actions/cache@v4
        with:
          path: client/src/renderer/public/mediapipe-wasm
          key: mediapipe-${{ hashFiles('client/scripts/setup-mediapipe.mjs') }}

      - name: Write .env
        run: |
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" > client/.env
          echo "VITE_AI_BASE_URL=${{ secrets.VITE_AI_BASE_URL }}" >> client/.env
          echo "VITE_AI_WS_URL=${{ secrets.VITE_AI_WS_URL }}" >> client/.env
        shell: bash

      - name: Install dependencies
        run: npm install
        working-directory: client

      - name: Set version from tag
        shell: bash
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//' | sed 's/-.*//')
          npm version $VERSION --no-git-tag-version --allow-same-version
        working-directory: client

      - name: Build Windows
        run: |
          npm run build
          npx electron-builder --win --publish never
        working-directory: client

      - name: Upload Windows installer to Release
        uses: softprops/action-gh-release@v2
        with:
          files: client/dist/*.exe

  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache mediapipe models
        uses: actions/cache@v4
        with:
          path: client/src/renderer/public/mediapipe-wasm
          key: mediapipe-${{ hashFiles('client/scripts/setup-mediapipe.mjs') }}

      - name: Write .env
        run: |
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" > client/.env
          echo "VITE_AI_BASE_URL=${{ secrets.VITE_AI_BASE_URL }}" >> client/.env
          echo "VITE_AI_WS_URL=${{ secrets.VITE_AI_WS_URL }}" >> client/.env

      - name: Install dependencies
        run: npm install
        working-directory: client

      - name: Set version from tag
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//' | sed 's/-.*//')
          npm version $VERSION --no-git-tag-version --allow-same-version
        working-directory: client

      - name: Build Mac
        run: |
          npm run build
          npx electron-builder --mac --publish never
        working-directory: client
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Mac installer to Release
        uses: softprops/action-gh-release@v2
        with:
          files: client/dist/*.dmg

  update-readme:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update download links in README.md
        run: |
          TAG=${{ github.ref_name }}
          VERSION=$(echo "$TAG" | sed 's/^v//' | sed 's/-.*//')

          # GitHub Release URL의 태그 부분 교체
          sed -i "s|/releases/download/v[^/]*/|/releases/download/$TAG/|g" README.md

          # 파일명의 버전 부분 교체
          sed -i "s|kkobuk-[0-9][0-9.]*-setup\.exe|kkobuk-$VERSION-setup.exe|g" README.md
          sed -i "s|kkobuk-[0-9][0-9.]*\.dmg|kkobuk-$VERSION.dmg|g" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update download links to ${{ github.ref_name }}"
          git push origin main
